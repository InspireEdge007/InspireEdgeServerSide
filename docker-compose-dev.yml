services:
  web:
    build: .
    command: >
      sh -c "
      python wait_for_db.py &&
      uvicorn AI.asgi:application --host 0.0.0.0 --port 8888 --reload
      "
    volumes:
      - .:/app
    expose:
      - 8888
    deploy:
      mode: replicated
      replicas: 1
    depends_on:
      - db
    env_file:
      - ./.env
    networks:
      - AI-network

  db:
    container_name: AI_postgres
    image: postgres:${PG_VERSION:-16}
    volumes:
      - AI-postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    networks:
      - AI-network

  nginx:
    container_name: AI_nginx
    image: nginx:1.19
    ports:
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - ./staticfiles:/app/staticfiles

    depends_on:
      - web
    networks:
      - AI-network

  redis:
    container_name: AI_redis
    image: "redis:alpine"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    env_file:                     # NEW: pass the password here too
      - ./.env
    networks:
      - AI-network

  celery:
    container_name: AI_celery
    build: .
    command: ["celery", "-A", "AI", "worker", "--loglevel=INFO"]
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    env_file:
      - ./.env
    networks:
      - AI-network

  celery-beat:
    build:
      context: .
    container_name: AI_celery_beat
    command: ["celery", "-A", "AI", "beat", "--loglevel=info"]
    depends_on:
      - redis
      - web
    env_file:
      - ./.env
    networks:
      - AI-network

  flower:
    build:
      context: .
    container_name: AI_celery_flower
    command: ["celery", "-A", "AI", "flower", "--port=5555"]
    ports:
      - "5555:5555"
    volumes:
    - .:/app    
    depends_on:
      - redis
      - celery
    env_file:         
      - ./.env      
    networks:
      - AI-network

volumes:
  AI-postgres-data:

networks:
  AI-network:
